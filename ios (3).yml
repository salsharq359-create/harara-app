# Builds an UNSIGNED iPhone app (Harara.ipa) on a free GitHub macOS machine.
# Install it on the iPhone from Windows with Sideloadly (it signs with your Apple ID).
#
# Run it: GitHub > Actions > "Build iPhone app" > Run workflow.
# Download: open the finished run > Artifacts > Harara-ipa.

name: Build iPhone app

on:
  workflow_dispatch:        # start it by hand from the Actions tab

jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 120

    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          path: harara-app

      # The repo holds the code as Harara_app_python.zip. Without this step the app
      # has no main.py inside it and closes the moment it is opened.
      - name: Unzip the app code
        run: |
          cd harara-app
          if [ ! -f main.py ]; then
            ZIP=$(ls *.zip | head -1)
            echo "Unzipping $ZIP"
            rm -rf /tmp/src && unzip -q -o "$ZIP" -d /tmp/src
            SRC=$(dirname "$(find /tmp/src -name main.py -not -path '*/service/*' | head -1)")
            cp -R "$SRC"/. .
            rm -f *.zip ios.yml
          fi
          rm -rf tests tools .github README.md
          test -f main.py && test -f harara.kv
          ls -R

      - name: Python 3.11 (same version kivy-ios builds for the phone)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build tools
        run: |
          brew install autoconf automake libtool pkg-config
          python -m pip install --upgrade pip
          pip install "kivy-ios==2025.5.17" "Cython==3.0.11"

      # The slow part (about 30-60 minutes). Cached, so later runs are much faster.
      - name: Cache the iPhone libraries
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            build
            dist
          key: kivy-ios-2025.5.17-iphoneos-arm64-intel-v1

      - name: Build Python, Kivy, pyobjus and plyer for iPhone
        if: steps.cache.outputs.cache-hit != 'true'
        run: toolchain build python3 kivy pyobjus plyer --platform iphoneos-arm64

      - name: Create the Xcode project
        run: |
          rm -rf harara-ios
          toolchain create Harara harara-app

      - name: Enable harara:// links (Shortcuts can start a session)
        run: |
          PLIST=$(find harara-ios -name "*Info.plist" -not -path "*/build/*" | head -1)
          echo "Info.plist: $PLIST"
          test -n "$PLIST"
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes array" \
            -c "Add :CFBundleURLTypes:0 dict" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLName string org.harara.links" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string harara" \
            "$PLIST"
          MAIN=$(grep -rl "Running main.py" harara-ios --include=main.m | head -1)
          echo "main.m: $MAIN"
          test -n "$MAIN"
          python3 - "$MAIN" <<'PY'
          import sys
          p = sys.argv[1]
          src = open(p).read()
          helper = r'''
          #import <objc/runtime.h>
          // Harara: when a harara:// link opens the app, write it to a file that Python reads.
          static BOOL harara_open_url(id self, SEL _cmd, UIApplication *app, NSURL *url, NSDictionary *options) {
              if (url != nil) {
                  NSString *dir = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES).firstObject;
                  NSString *path = [dir stringByAppendingPathComponent:@"harara_pending_url.txt"];
                  [[url absoluteString] writeToFile:path atomically:YES encoding:NSUTF8StringEncoding error:nil];
              }
              return YES;
          }
          static void harara_install_url_handler(void) {
              Class c = NSClassFromString(@"SDLUIKitDelegate");
              if (c != nil) {
                  class_replaceMethod(c, @selector(application:openURL:options:), (IMP)harara_open_url, "B@:@@@");
              }
          }
          '''
          assert src.count("int main(int argc, char *argv[]) {") == 1
          src = src.replace("int main(int argc, char *argv[]) {", helper + "\nint main(int argc, char *argv[]) {", 1)
          anchor = "    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];"
          assert src.count(anchor) == 1
          install = anchor + r'''
              harara_install_url_handler();
              [[NSNotificationCenter defaultCenter] addObserverForName:UIApplicationDidFinishLaunchingNotification
                  object:nil queue:nil usingBlock:^(NSNotification *note) { harara_install_url_handler(); }];'''
          src = src.replace(anchor, install, 1)
          open(p, "w").write(src)
          print("main.m patched")
          PY

      - name: Put the Harara logo on the iPhone app icon
        run: |
          ICONSET=$(find harara-ios -name "AppIcon.appiconset" -type d | head -1)
          echo "Icon set: $ICONSET"
          test -n "$ICONSET"
          cp harara-app/icon.png "$ICONSET/icon-1024.png"
          printf '%s\n' '{' '  "images" : [' '    { "filename" : "icon-1024.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" }' '  ],' '  "info" : { "author" : "xcode", "version" : 1 }' '}' > "$ICONSET/Contents.json"
            - name: Put the Harara logo on the launch screen
        run: |
          pip install pillow
          echo "--- images and launch files in the Xcode template ---"
          find harara-ios \( -name "*.png" -o -name "*.xib" -o -name "*.storyboard" \) -not -path "*/build/*" | sort
          python - <<'PY'
          import glob
          from PIL import Image

          splash = Image.open("harara-app/splash.png").convert("RGBA")
          hits = 0
          for path in glob.glob("harara-ios/**/*.png", recursive=True):
              low = path.lower()
              if "appicon" in low or "/build/" in low:
                  continue
              if not any(k in low for k in ("launch", "default", "splash")):
                  continue
              try:
                  w, h = Image.open(path).size
              except Exception:
                  continue
              bg = Image.new("RGB", (w, h), (0, 0, 0))
              logo = splash.copy()
              logo.thumbnail((int(min(w, h) * 0.4),) * 2, Image.LANCZOS)
              bg.paste(logo, ((w - logo.width) // 2, (h - logo.height) // 2), logo)
              bg.save(path)
              hits += 1
              print("launch image ->", path, w, h)
          print("replaced", hits, "launch images")
          PY
      - name: Build the app (no signing; Sideloadly signs it later)
        run: |
          # -target (the template has no shared scheme); deployment target raised from the
          # template's 9.0, which newer Xcode can no longer link (libarclite was removed).
          xcodebuild -project harara-ios/harara.xcodeproj \
                     -target harara \
                     -configuration Release \
                     -sdk iphoneos \
                     SYMROOT="$PWD/xbuild" \
                     IPHONEOS_DEPLOYMENT_TARGET=13.0 \
                     CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
                     build | tail -200
          test "${PIPESTATUS[0]}" -eq 0

      - name: Check main.py is inside the app
        run: |
          APP=$(find xbuild -maxdepth 3 -name "*.app" -type d | head -1)
          find "$APP" -name "main.py*" | grep . || { echo "main.py is missing from the app"; exit 1; }

      - name: Package Harara.ipa
        run: |
          APP=$(find xbuild -maxdepth 3 -name "*.app" -type d | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Harara.ipa Payload
          ls -lh Harara.ipa

      - name: Upload Harara.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Harara-ipa
          path: Harara.ipa
          retention-days: 14
